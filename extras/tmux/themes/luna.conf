# luna.nvim tmux theme
# Authored from luna.nvim's palette (lua/luna/palette.lua):
#   https://github.com/WTFox/luna.nvim
# luna is a near-black, dark-only colorscheme. There is no upstream tmux extra,
# so this file mirrors the same greys + four-accent identity here.
#
# Sourced from ~/.tmux.conf via: source-file ~/.tmux/themes/luna.conf

# --- luna palette -----------------------------------------------------------
# Surfaces (dark -> darkest)
luna_bg="#060606"        # bg      - deepest near-black (status bar bg)
luna_panel="#1c1c1c"     # bg_alt  - subtle panel background
luna_dim_bg="#1f1f1f"    # bg_soft - slightly brighter panel
luna_border="#404040"    # border  - inactive borders / separators

# Foreground / greys
luna_fg="#e4e4e8"        # fg        - main foreground
luna_fg_muted="#7c7c7c"  # comment   - muted text (inactive windows)
luna_fg_dim="#605958"    # grey_warm - dim text (separators, clock)

# Accents (luna's four hues + diagnostics)
luna_blue="#75a1c7"      # func    - navigation / focus (session, selection)
luna_blue_2="#8c9cb8"    # info    - active pane border, current match
luna_green="#6fbe80"     # ok      - activity / progress / search matches
luna_amber="#d9a35a"     # warning - modes & attention (copy-mode, current win, bell)
luna_amber_2="#c2916a"   # signal  - softer amber
luna_red="#e08585"       # error   - alerts

# --- status bar -------------------------------------------------------------
set -g status-interval 2
set -g status-justify left
set -g status-left-length 50
set -g status-position top
set -g status-right ""
set -g status-right-length 80
set -g status-style "fg=${luna_fg},bg=${luna_bg}"

set -g status-left "#[fg=${luna_blue},bold] #S #[fg=${luna_fg_dim}]| "

# --- panes ------------------------------------------------------------------
set -g pane-border-style "fg=${luna_border}"
set -g pane-active-border-style "fg=${luna_blue_2}"

# --- windows ----------------------------------------------------------------
set -g window-status-activity-style "fg=${luna_green},bold"
set -g window-status-bell-style "fg=${luna_amber},bold"
set -g window-status-current-format "#[fg=${luna_amber},bold] #[underscore]#I:#W#[nounderscore]"
set -g window-status-format "#[fg=${luna_fg_muted}] #I:#W "

# --- modes / copy-mode ------------------------------------------------------
# Mode bar (amber)
set -g mode-style "fg=${luna_bg},bg=${luna_amber}"

# Selection (blue)
set -g copy-mode-selection-style "fg=${luna_bg},bg=${luna_blue}"

# Search matches (green), current match (blue)
set -g copy-mode-match-style "fg=${luna_bg},bg=${luna_green}"
set -g copy-mode-current-match-style "fg=${luna_bg},bg=${luna_blue_2}"

# --- messaging / prompt -----------------------------------------------------
set -g message-style "fg=${luna_fg},bg=${luna_panel}"
set -g message-command-style "fg=${luna_fg},bg=${luna_panel}"
